name: QA execution
run-name: QA execution ${{ inputs.request_key }}

on:
  workflow_dispatch:
    inputs:
      request_key:
        description: SHA-256 key of a request already persisted by the controller
        required: true
        type: string

permissions: {}

concurrency:
  group: qa-execution-${{ inputs.request_key }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: qa-control
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Only reviewed bot code; never a target PR ref or archive.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read trusted request and download exact target revision as data
        run: node src/prepare-execution.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_ID: ${{ secrets.QA_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.QA_APP_PRIVATE_KEY }}
          TARGET_OWNER: ${{ vars.TARGET_OWNER }}
          TARGET_REPO: ${{ vars.TARGET_REPO }}
          REQUEST_KEY: ${{ inputs.request_key }}
          BUNDLE_DIR: ${{ runner.temp }}/qa-bundle
          QA_ENABLED: ${{ vars.QA_ENABLED || 'false' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
      - uses: actions/upload-artifact@v4
        with:
          name: qa-source-${{ inputs.request_key }}
          path: ${{ runner.temp }}/qa-bundle/
          retention-days: 1
          if-no-files-found: error
          # Identical immutable request/source; rerunning all jobs can replace it.
          # Failed-job reruns can reuse the original prepare artifact.
          overwrite: true

  execute:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: qa-source-${{ inputs.request_key }}
          path: ${{ runner.temp }}/qa-bundle
      - name: Verify and safely extract source data
        run: python3 src/unpack-source.py "$RUNNER_TEMP/qa-bundle/source.tar.gz" "$RUNNER_TEMP/qa-bundle/source.json" "$RUNNER_TEMP/qa-source"
      - name: Identify trusted browser suites
        id: browser
        run: node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/qa-bundle/request.json"));fs.appendFileSync(process.env.GITHUB_OUTPUT,"needed="+r.plan.checks.some(c=>c.method==="automated"&&r.config.runners.some(x=>x.id===c.runner&&x.type==="web-preview"))+"\n");'
      - name: Install trusted bot browser tooling
        if: steps.browser.outputs.needed == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/playwright-core/cli.js install --with-deps chromium firefox webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/qa-browsers
      - name: Pull trusted test environment before disabling network for PR code
        run: |
          node -e 'const fs=require("node:fs");const {spawnSync}=require("node:child_process");const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/qa-bundle/request.json"));const i=r.config.execution?.image||"node:22-bookworm-slim";if(!/^[a-zA-Z0-9][a-zA-Z0-9._:/@-]+$/.test(i))throw Error("Invalid image");const p=spawnSync("docker",["pull",i],{stdio:"inherit"});process.exit(p.status??1);'
      - name: Run isolated checks and collect structured results
        run: node src/execute.js --request "$RUNNER_TEMP/qa-bundle/request.json" --checkout "$RUNNER_TEMP/qa-source" --attestation "$RUNNER_TEMP/qa-bundle/source.json" --output "$RUNNER_TEMP/qa-results"
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/qa-browsers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-results-${{ inputs.request_key }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-results/
          retention-days: 30
          if-no-files-found: error
